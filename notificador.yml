name: Notificador Telegram PCP

on:
  schedule:
    # Roda sempre ao minuto 5 de todas as horas (08:05, 09:05, etc.)
    - cron: '5 * * * *'
  workflow_dispatch: # Permite rodar manualmente com um botão para testar

jobs:
  executar_script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          pip install supabase requests pytz

      - name: Rodar Notificador
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notificador.py
